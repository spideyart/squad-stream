# Builds the debug APK in the cloud — no PC needed.
# After pushing, download the APK from the Actions tab of the repo.
name: Android CI - SquadStream debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.11"

      - name: Build debug APK
        env:
          ABLY_API_KEY: ${{ secrets.ABLY_API_KEY }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: squadstream-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
