[versions]
# Pinned to a known-good set (Nov 2026). Bump only one at a time if a build fails.
# Kotlin MUST be 2.2.x: RootEncoder pulls kotlinx-coroutines 1.11.0, whose
# metadata is Kotlin 2.2.0 — the 2.0.21 compiler crashes on it
# (FirIncompatibleClassExpressionChecker: "source must not be null").
agp = "8.7.3"
kotlin = "2.2.0"
composeBom = "2024.09.00"
coreKtx = "1.13.1"
lifecycleRuntimeKtx = "2.8.5"
activityCompose = "1.9.2"
rootencoder = "2.8.2"
# Phase 3 — voice room. WebRTC: Google's org.webrtc:google-webrtc is dead
# (last 1.0.32006, Aug 2020, JCenter gone); use the maintained webrtc-sdk
# fork, same org.webrtc.* package, newest 150-series build (Nov 2026).
webrtc = "150.7871.01"
# Supabase Realtime (Broadcast) for voice-room signaling. supabase-kt 3.x;
# the BOM pins the module versions. Ktor engine (okhttp) is required
# explicitly — supabase-kt never brings an engine transitively.
supabaseBom = "3.9.0"
ktor = "3.3.0"
kotlinxSerialization = "1.9.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
# RootEncoder (RTMP screen streaming) via JitPack — newest release 2.8.2 (2026-11-11)
rootencoder-library = { group = "com.github.pedroSG94.RootEncoder", name = "library", version.ref = "rootencoder" }
# Phase 3 — WebRTC voice room (maintained webrtc-sdk fork, org.webrtc.* API)
webrtc-sdk = { group = "io.github.webrtc-sdk", name = "android", version.ref = "webrtc" }
# Phase 3 — Supabase Realtime signaling (Broadcast channels, no tables needed)
supabase-bom = { group = "io.github.jan-tennert.supabase", name = "bom", version.ref = "supabaseBom" }
supabase-realtime = { group = "io.github.jan-tennert.supabase", name = "realtime-kt" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
